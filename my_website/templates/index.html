
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>My Website</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        nav {
            max-width: 900px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: #555;
            text-decoration: none;
        }

        main {
            max-width: 900px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 4px 20px #00000008;
        }

        .button {
            display: inline-block;
            margin-top: 12px;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .proxy-form {
            margin-top: 16px;
            display: grid;
            gap: 10px;
        }

        .proxy-form label {
            font-weight: 600;
        }

        .proxy-form input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }

        .note {
            margin-top: 16px;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 24px;
            color: #777;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <strong>My Website</strong>
            <a href="/about">このサイトについて</a>
        </nav>
    </header>

    <main>
        <section class="card">
            <h1>Webプロキシビューア</h1>
            <p>
                URLを入力すると、このサーバー経由でページを取得して表示します。
                一般的な静的ページ向けの簡易実装です。
            </p>
            <form action="/proxy" method="get" class="proxy-form">
                <label for="url">URL</label>
                <input id="url" name="url" type="url" placeholder="https://example.com" required>
                <button class="button" type="submit">表示する</button>
            </form>
            <p class="note">
                注意: JavaScript依存サイト、ログイン、動画配信、ボット検知/認証があるサイト（例: YouTube）は
                正常に動作しない場合があります。ログイン要求やボット判定の回避機能は提供しません。
            </p>
        </section>
    </main>

    <footer>
        &copy; 2026 My Website
    </footer>
</body>
</html>
